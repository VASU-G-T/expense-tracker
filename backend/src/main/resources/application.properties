# ===========================
# Server Configuration
# ===========================
server.port=${SERVER_PORT:8080}

# ===========================
# Firebase Configuration
# ===========================
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.project.id=${FIREBASE_PROJECT_ID:}

# ===========================
# CORS Configuration
# ===========================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===========================
# Logging
# ===========================
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n

# ===========================
# Jackson
# ===========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
